name: Spor Takip
on:
  schedule:
    - cron: '2-59/5 * * * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Bildirim gondermeden dene'
        type: boolean
        default: true
  push:
    branches: [main]
    paths:
      - '.github/workflows/tracker.yml'
      - 'scripts/tracker.py'
      - 'tests/test_tracker.py'
      - 'requirements.txt'
permissions:
  contents: write
concurrency:
  group: sports-tracker-state
  cancel-in-progress: false
jobs:
  track:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Bagimliliklari kur
        run: python -m pip install --disable-pip-version-check -r requirements.txt
      - name: Alarm, veri ve tekrar bildirim testleri
        run: python -m unittest discover -s tests -v
      - name: Takip kontrolu
        env:
          ALERTS_JSON: ${{ secrets.ALERTS_JSON }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          GITHUB_TOKEN: ${{ github.token }}
          DRY_RUN: ${{ github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.dry_run) }}
        run: python -m scripts.tracker
