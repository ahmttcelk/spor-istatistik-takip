name: Alarm Ekranini Yayinla
on:
  workflow_dispatch:
  schedule:
    - cron: '17 3 * * *'
  push:
    branches: [main]
    paths:
      - 'docs/**'
      - 'scripts/build_catalogue.py'
      - '.github/workflows/pages.yml'
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: tablet-alarm-pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Guncel takim listelerini hazirla
        run: python3 -m scripts.build_catalogue
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs
  deploy:
    if: github.event_name != 'push'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v4
        id: deployment
