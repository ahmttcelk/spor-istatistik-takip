name: Ucretsiz Kaynak Kontrolu
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: public-sports-source-probe
  cancel-in-progress: false
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Test bagimliliklarini kur
        run: python3 -m pip install --disable-pip-version-check -r requirements.txt
      - name: Guvenlik testleri
        run: python3 -m unittest discover -s tests -v
      - name: Futbol ve NBA kaynagini kontrol et
        run: python3 -m scripts.probe_public_sources
